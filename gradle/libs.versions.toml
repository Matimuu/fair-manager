# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format
[versions]
#Core
#----
javaVersion = "25"
springBootVersion = "4.0.3"
mapstructVersion = "1.6.3"

# Migration
#----
flywayVersion = "11.14.1"

# Compile only
#----
lombokVersion = "1.18.42"

# Database
#----
postgresqlVersion = "42.7.10"

# Testing
#----
junitPlatformVersion = "6.0.3"
testContainersVersion = "1.21.4"


[libraries]
# BOMs
bom_spring_boot = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBootVersion" }

# Dependencies ⬇️
# Spring Boot
actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
data_jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
devtools = { module = "org.springframework.boot:spring-boot-devtools" }

mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstructVersion" }
mapstruct_processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstructVersion" }

## Compile only ⬇️
# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombokVersion" }
lombok_processor = { module = "org.projectlombok:lombok", version.ref = "lombokVersion" }

# Flyway (DB-specific module; обычно подключают как runtimeOnly)
flyway_database_postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywayVersion" }

## Runtime only ⬇️
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresqlVersion" }

## Test dependencies ⬇️
spring_boot_test = { module = "org.springframework.boot:spring-boot-starter-test" }
actuatorTest = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
data_jpaTest = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
flywayTest = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
validationTest = { module = "org.springframework.boot:spring-boot-starter-validation-test" }
webmvcTest = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }

### Containers
testContainers_junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testContainersVersion"}
testContainers_postgresql = { module = "org.testcontainers:postgresql", version.ref = "testContainersVersion"}
testContainers_boot = {module = "org.springframework.boot:spring-boot-testcontainers"}

junit_platform_launcher_test = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformVersion" }

[bundles]

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBootVersion" }